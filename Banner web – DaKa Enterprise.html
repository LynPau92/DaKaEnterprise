<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DaKa Enterprise – Banner web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1E3A5F; --card:#075143; --ink:#F5F6F7; --muted:rgba(245,246,247,.82); --line:rgba(245,246,247,.55);
  --btn-bg: #F5F6F7; --btn-ink:#0A2E28;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A17;}}
:root[data-theme="dark"]{--bg:#0B1A17;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.banner{width:100%;max-width:1000px;background:var(--card);color:var(--ink);border-radius:14px;display:grid;grid-template-columns:1.25fr 1fr;gap:0;align-items:center;padding:0;overflow:hidden}
.copy{padding:34px 12px 34px 44px}
.logo{display:block;width:210px;max-width:60%;height:auto;margin-bottom:26px}
h1{margin:0;font-size:clamp(28px,4.2vw,46px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
h1 span{display:block;font-weight:400;font-size:.62em;color:var(--muted);margin-top:10px;letter-spacing:0}
p{margin:16px 0 22px;color:var(--muted);font-size:clamp(15px,1.6vw,18px);max-width:46ch}
.cta{display:inline-block;background:var(--btn-bg);color:var(--btn-ink);font:inherit;font-weight:800;font-size:17px;border:0;border-radius:8px;padding:13px 26px;cursor:pointer}
.cta:hover{filter:brightness(.93)}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.msg{margin-top:12px;font-size:14px;color:var(--muted);min-height:1.2em}
.photo{align-self:stretch;min-height:340px;width:100%;height:100%;object-fit:cover;object-position:62% 60%;display:block}
@media (max-width:720px){.banner{grid-template-columns:1fr}.photo{order:-1;min-height:0;height:210px}.copy{padding:26px 22px 30px}}
</style>
</head>
